[project]
name = "toyotarag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "qdrant-client>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toyota_rag"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

